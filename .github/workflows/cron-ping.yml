name: Ping Autonomous Publisher API

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes (GitHub Actions minimum for free tier is 5 minutes)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit API Cron endpoint
        run: |
          curl -s https://rcbautopubl.vercel.app/api/cron
